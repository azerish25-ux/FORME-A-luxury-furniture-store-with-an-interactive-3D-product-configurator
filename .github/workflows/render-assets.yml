name: Author Arc models and configuration imagery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forme-arc-authoring-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        part: [studio, Compact, Generous, Chaise]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install checksum-verified Blender
        run: |
          mkdir -p /tmp/blender /tmp/blender-download
          cd /tmp/blender-download
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender-4.5.3-linux-x64.tar.xz
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.3.sha256 -o checksums.txt
          grep 'blender-4.5.3-linux-x64.tar.xz' checksums.txt | sha256sum --check
          tar -xf blender-4.5.3-linux-x64.tar.xz -C /tmp/blender --strip-components=1
          echo '/tmp/blender' >> "$GITHUB_PATH"
          python -m pip install Pillow==11.3.0 numpy==2.2.6
      - name: Produce original geometry and authored renders
        env:
          PART: ${{ matrix.part }}
        run: |
          python tools/arc-materials.py
          if [ "$PART" = studio ]; then
            blender -b -t 4 --python tools/arc-assets.py -- --mode models
            blender -b -t 4 --python tools/arc-assets.py -- --mode details --samples 64 --width 1440
          else
            blender -b -t 4 --python tools/arc-assets.py -- --mode posters --size "$PART" --samples 48 --width 1440
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: arc-originals-${{ matrix.part }}
          path: |
            assets/*.png
            assets/arc-*.glb
            assets/arc-dimensions.json
            tools/Arc-master.blend
          retention-days: 7
  verify:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: arc-originals-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Strict packaging and independent verification
        run: |
          python -m pip install Pillow==11.3.0
          python tools/arc-pack.py --strict
          npm ci
          npm run build
          npm run verify:arc
          git rev-parse HEAD > evidence/authoring-source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arc-authored-review
          path: |
            assets/arc-*.webp
            assets/arc-*.png
            assets/arc-*.glb
            assets/arc-dimensions.json
            assets/arc-asset-manifest.json
            tools/Arc-master.blend
            evidence/
          retention-days: 14
# Authoring is artifact-only. Review and commit approved derivatives through the
# normal storefront acceptance pipeline; never overwrite main from a render job.
