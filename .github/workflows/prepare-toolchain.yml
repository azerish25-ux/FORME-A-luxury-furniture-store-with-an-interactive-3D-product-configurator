name: Prepare reproducible FORME toolchain
on:
  push:
    paths: ['.github/workflows/prepare-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned development dependencies
        run: |
          mkdir toolchain && cd toolchain
          npm init -y
          npm install --save-exact three@0.180.0 liquidjs@10.21.1 esbuild@0.25.9 @playwright/test@1.55.1 @axe-core/playwright@4.10.2
          tar -czf ../forme-toolchain.tar.gz package.json package-lock.json node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: forme-toolchain
          path: forme-toolchain.tar.gz
          retention-days: 2
