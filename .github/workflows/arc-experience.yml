name: Arc experience verification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reproducible build, domain contracts and asset integrity
        run: |
          set -o pipefail
          mkdir -p evidence
          npm ci
          npm audit --audit-level=high --json > evidence/npm-audit.json
          npm run build
          npm run typecheck
          npm test | tee evidence/domain-tests.txt
          npm run check | tee evidence/liquid-validation.txt
          npm run verify:arc | tee evidence/arc-verification.txt
          node scripts/export-catalog.mjs
          npm run package
          node scripts/static-preview.mjs
          git diff --exit-code -- assets src snippets fixtures package-lock.json
      - name: Native Shopify Theme Check
        run: npx --yes --package @shopify/cli@4.8.2 shopify theme check --path artifacts/theme --output json --fail-level error > evidence/shopify-theme-check.json
      - name: Browser, responsive and accessibility contracts
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
          npm run test:static
      - name: Package the tested source and static preview
        run: |
          git rev-parse HEAD > evidence/source-commit.txt
          git archive --format=zip --prefix=FORME/ --output=artifacts/FORME-Source.zip HEAD
          (cd artifacts/preview && zip -qr ../FORME-Preview.zip .)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forme-quality-evidence
          path: |
            evidence/
            playwright-report/
            playwright-static-report/
            test-results/
            static-test-results/
            artifacts/FORME-Shopify-Theme.zip
            artifacts/FORME-Shopify-Theme.zip.sha256
            artifacts/FORME-Source.zip
            artifacts/FORME-Preview.zip
          retention-days: 14
