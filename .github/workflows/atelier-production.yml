name: FORME Atelier production
on:
  push:
    paths: ['.github/workflows/atelier-production.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package locked dependencies for isolated authoring review
        run: tar -czf forme-toolchain.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: forme-atelier-toolchain
          path: forme-toolchain.tar.gz
          retention-days: 2
