name: Arc experience verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/arc-experience.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forme-arc-experience-recovery
  cancel-in-progress: false
jobs:
  recover-source:
    name: Recover authored source and dependency diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Expand hash-verified source saved before the interrupted session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          parts = ['63bee881aa8d83b0d15438bec733a2611ea1e1cf','ee43a618b152e0023fac08d7c9aa502ec6403ac5','3c809fc2739db811fd7244d447d3eca7e405214d','5826ad422c30c603640e1dc6bc68cc53029d50d8','f398745c18e355fbdc1a031e0d06d54d0b65fe7e','3b60893aa44f8c7ad100828cf5d62074a3596421']
          def blob(sha):
              url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha
              request = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'FORME-source-recovery'})
              with urllib.request.urlopen(request, timeout=60) as response: item=json.load(response)
              raw=base64.b64decode(item['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              return raw
          archive=b''.join(blob(sha) for sha in parts)
          assert hashlib.sha256(archive).hexdigest()=='1994bbb844f33b6ae47aadf61c083a96d47ae9a83623373b537f0dc0ee43758e'
          packet=json.loads(lzma.decompress(archive))
          assert packet['schema']==1 and len(packet['files'])==40
          root=pathlib.Path.cwd().resolve()
          for name,text in packet['files'].items():
              path=pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in ('.git','.github')
              assert (root/path).resolve().is_relative_to(root) and isinstance(text,str)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf-8')
          exec(compile(blob('482f6fe84f31594efa712dc363d3b53cf284a0ac'),'<verified-finish-corrections>','exec'))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve source and identify the dependency advisory
        run: |
          mkdir -p recovery
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --json > recovery/npm-audit.json || true
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('.')
          excluded={'.git','node_modules','recovery','artifacts','evidence','test-results','playwright-report','.arc-cache'}
          with zipfile.ZipFile('recovery/source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob('*'):
                  if path.is_file() and not set(path.parts)&excluded and path.suffix not in ('.woff','.woff2','.ttf','.otf'):
                      archive.write(path,path.as_posix())
          PY
          tar -czf recovery/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-source-recovery
          path: recovery/
          retention-days: 2
