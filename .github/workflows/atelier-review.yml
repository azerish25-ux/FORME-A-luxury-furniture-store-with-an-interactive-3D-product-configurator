name: FORME Atelier release review
on:
  push:
    paths: ['.github/workflows/atelier-review.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: forme-atelier-release-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover authored source and correct inverse-surface contrast
        run: |
          python - <<'PY'
          import base64,lzma,pathlib,subprocess
          chunks=sorted(pathlib.Path('tools').glob('atelier-source.*.b64'))
          assert len(chunks)==4
          patch=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks)))
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          final=pathlib.Path('tools/atelier-production-final.yml')
          pathlib.Path('.github/workflows/atelier-production.yml').write_bytes(final.read_bytes())
          final.unlink()
          for p in chunks:p.unlink()
          pathlib.Path('.github/workflows/atelier-review.yml').unlink()
          css=pathlib.Path('assets/atelier.css')
          text=css.read_text()
          assert 'color: #8b8d7c;' in text
          assert '.footer-bottom { border-top-color: #657160; }' in text
          text=text.replace('color: #8b8d7c;', 'color: var(--md-sys-color-secondary);')
          text=text.replace('--md-sys-color-on-error: #ffffff;', '--md-sys-color-on-error: #ffffff;\n  --md-sys-color-inverse-surface: #2d3a31;\n  --md-sys-color-inverse-on-surface: #f5f2eb;')
          text=text.replace('.site-footer { background: #2d3a31; color: #f5f2eb;', '.site-footer { background: var(--md-sys-color-inverse-surface); color: var(--md-sys-color-inverse-on-surface);')
          text=text.replace('.footer-bottom { border-top-color: #657160; }', '.footer-bottom { border-top-color: #657160; color: var(--md-sys-color-inverse-on-surface); font-size: 12px; }\n.footer-bottom > span { color: inherit; }')
          css.write_text(text)
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 36666040512
          github-token: ${{ github.token }}
          pattern: atelier-originals-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build source and original assets
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m pip install Pillow==11.3.0
          python tools/arc-pack.py --strict
          python tools/atelier-pack.py
          python tools/atelier-design.py
          npm ci
          npm run build
          npm run typecheck
          npm test | tee evidence/domain-tests.txt
          npm run check | tee evidence/liquid-validation.txt
          npm run verify:arc | tee evidence/arc-verification.txt
          npm run verify:atelier | tee evidence/atelier-verification.txt
          node scripts/export-catalog.mjs
          npm run package
          node scripts/static-preview.mjs
      - name: Package inspectable source before browser acceptance
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,zipfile
          files=subprocess.check_output(['git','ls-files','-co','--exclude-standard','-z']).decode().split('\0')
          with zipfile.ZipFile('artifacts/FORME-Source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in sorted(set(filter(None,files))):
              if Path(name).is_file():z.write(name,'FORME/'+name)
          with zipfile.ZipFile('artifacts/FORME-Preview.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('artifacts/preview').rglob('*'):
              if p.is_file():z.write(p,str(p.relative_to('artifacts/preview')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-source-inspection
          path: |
            artifacts/FORME-Source.zip
            artifacts/FORME-Preview.zip
            artifacts/FORME-Shopify-Theme.zip
          retention-days: 14
      - name: Shopify theme acceptance
        run: npx --yes --package @shopify/cli@4.8.2 shopify theme check --path artifacts/theme --output json --fail-level error > evidence/shopify-theme-check.json
      - name: Browser and static acceptance
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e | tee evidence/browser-tests.txt
          npm run test:static | tee evidence/static-tests.txt
      - name: Create review objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,subprocess,time,urllib.request,urllib.error
          root='https://api.github.com/repos/'+os.environ['GH_REPO']
          def api(method,path,data=None):
            body=json.dumps(data).encode() if data is not None else None
            for attempt in range(4):
              req=urllib.request.Request(root+path,data=body,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              try:
                with urllib.request.urlopen(req,timeout=90) as res:return json.load(res)
              except urllib.error.HTTPError as e:
                if e.code not in (429,500,502,503,504) or attempt==3:raise
                time.sleep(2**attempt)
          parent=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          base=api('GET','/git/commits/'+parent)['tree']['sha']
          subprocess.run(['git','add','-A'],check=True)
          names=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          entries=[]
          for name in filter(None,names):
            p=pathlib.Path(name)
            if not p.exists():
              entries.append({'path':name,'mode':'100644','type':'blob','sha':None})
              continue
            content=p.read_bytes()
            assert len(content)<50_000_000, 'Oversized source object: '+name
            blob=api('POST','/git/blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
            mode=subprocess.check_output(['git','ls-files','--stage','--',name],text=True).split()[0]
            entries.append({'path':name,'mode':mode,'type':'blob','sha':blob['sha']})
          assert entries
          tree=api('POST','/git/trees',{'base_tree':base,'tree':entries})
          commit=api('POST','/git/commits',{'message':'feat: publish Material Atelier storefront and authored furniture collection','tree':tree['sha'],'parents':[parent]})
          result={'parent':parent,'commit':commit['sha'],'tree':tree['sha'],'changed_files':len(entries),'branch_updated':False,'source_render_run':36666040512}
          pathlib.Path('evidence/review-commit.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier-release-evidence
          path: |
            evidence/
            playwright-report/
            playwright-static-report/
            test-results/
            static-test-results/
          retention-days: 14
